<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inequality in housing-market tightness</title>
<style>
  :root{--paper:#fbf8f2;--ink:#1c1b18;--terra:#7a4b2b;--muted:#6b6355;--hair:#d9d2c5;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Spectral",Georgia,"Times New Roman",serif;line-height:1.5;}
  .wrap{max-width:820px;margin:0 auto;padding:12px 14px 22px;}
  h1{font-size:1.3rem;margin:.2rem 0 .1rem;}
  .sub{color:var(--muted);margin:.1rem 0 .8rem;max-width:70ch;}
  .controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px;}
  .ctl{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);}
  .seg{display:inline-flex;border:1px solid var(--hair);border-radius:4px;overflow:hidden;}
  .seg button{font-family:inherit;font-size:.85rem;padding:5px 13px;border:0;background:var(--paper);color:var(--ink);cursor:pointer;}
  .seg button.on{background:var(--terra);color:#fff;}
  select{font-family:inherit;font-size:.9rem;padding:4px 6px;border:1px solid var(--hair);border-radius:4px;background:var(--paper);color:var(--ink);max-width:240px;}
  #chart{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:18px;font-size:.85rem;margin:6px 2px 0;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:20px;height:0;border-top:3px solid;display:inline-block;}
  .note{font-size:.78rem;color:var(--muted);margin:8px 2px 0;max-width:84ch;line-height:1.45;}
  .tip{position:fixed;pointer-events:none;background:#fffdf8;border:1px solid var(--hair);border-radius:3px;padding:6px 8px;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.12);opacity:0;transition:opacity .08s;z-index:20;}
  body.embed h1,body.embed .sub{display:none;}
  .ctl[hidden]{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Inequality in housing-market tightness</h1>
  <p class="sub">Tightness is search demand divided by listed supply. How unequal is it across the country, and where has it shifted?</p>
  <div class="controls">
    <div class="ctl">View<div class="seg" id="segView">
      <button data-v="ineq" class="on">Inequality over time</button><button data-v="reg">Where it shifted</button></div></div>
    <div class="ctl" id="regCtl" hidden>Highlight region<select id="selReg"></select></div>
    <div class="ctl" id="tenCtl" hidden>Tenure<div class="seg" id="segTen">
      <button data-v="Sale" class="on">Sale</button><button data-v="Rent">Rent</button></div></div>
  </div>
  <svg id="chart" viewBox="0 0 720 400" role="img" aria-label="Tightness inequality"></svg>
  <div class="legend" id="legend"></div>
  <div class="note" id="note"></div>
</div>
<div class="tip" id="tip"></div>
<script>
const $=id=>document.getElementById(id);
if(location.hash.includes("embed")||location.search.includes("embed"))document.body.classList.add("embed");
const NS="http://www.w3.org/2000/svg";
function el(n,a,t){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e;}
const COL={Sale:{f:"#6aa0d8",s:"#3f79bd"},Rent:{f:"#a98fd0",s:"#7d5cbf"}};
let D=null,view="ineq",region="London",tenure="Sale";

fetch("data/tightness.json?v=1").then(r=>r.json()).then(d=>{D=d;
  $("selReg").innerHTML=d.region_list.map(r=>`<option value="${r}"${r==="London"?" selected":""}>${r}</option>`).join("");
  $("selReg").onchange=()=>{region=$("selReg").value;draw();};
  $("segView").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;
    $("segView").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));
    $("regCtl").hidden=$("tenCtl").hidden=(view!=="reg");draw();});
  $("segTen").querySelectorAll("button").forEach(b=>b.onclick=()=>{tenure=b.dataset.v;
    $("segTen").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));draw();});
  draw();});

function frame(){const W=720,H=400;const svg=$("chart");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML="";
  svg.appendChild(el("rect",{x:1,y:1,width:W-2,height:H-2,rx:12,fill:"#fbf8f2",stroke:"#e4d8c4","stroke-width":1.5}));return{svg,W,H};}
function axes(svg,W,H,mL,mR,mT,mB,lo,hi,y0,y1,ylab,fmt){const pT=mT,pB=H-mB;
  const X=y=>mL+(y-y0)/(y1-y0)*(W-mL-mR),Y=v=>pT+(1-(v-lo)/(hi-lo))*(pB-pT);
  for(let i=0;i<=5;i++){const v=lo+(hi-lo)*i/5,gy=Y(v);
    svg.appendChild(el("line",{x1:mL,y1:gy,x2:W-mR,y2:gy,stroke:"#ece5d5","stroke-width":1}));
    svg.appendChild(el("text",{x:mL-8,y:gy+3,"text-anchor":"end","font-size":11,fill:"#6b6355","font-family":"Georgia,serif"},fmt(v)));}
  svg.appendChild(el("rect",{x:X(2020),y:pT,width:X(2021)-X(2020),height:pB-pT,fill:"#7a4b2b",opacity:.05}));
  svg.appendChild(el("text",{x:(X(2020)+X(2021))/2,y:pT+11,"text-anchor":"middle","font-size":11,fill:"#8a7358","font-family":"Georgia,serif"},"2020–21"));
  svg.appendChild(el("text",{x:15,y:(pT+pB)/2,"text-anchor":"middle","font-size":11,fill:"#6b6355","font-family":"Georgia,serif",transform:`rotate(-90 15 ${(pT+pB)/2})`},ylab));
  for(let yr=y0;yr<=y1;yr+=(y1-y0>10?2:1))svg.appendChild(el("text",{x:X(yr),y:pB+18,"text-anchor":"middle","font-size":11,fill:"#6b6355","font-family":"Georgia,serif"},yr));
  return{X,Y,pT,pB};}
function poly(svg,pts,color,w,op){svg.appendChild(el("path",{d:pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" "),fill:"none",stroke:color,"stroke-width":w,"stroke-opacity":op==null?1:op,"stroke-linejoin":"round"}));}

function drawIneq(){const {svg,W,H}=frame();const mL=58,mR=18,mT=26,mB=44;
  const rows=D.theil;const vals=rows.map(r=>r.theil);const hi=Math.max(...vals)*1.1,lo=0;
  const {X,Y}=axes(svg,W,H,mL,mR,mT,mB,lo,hi,2010,2025,"Theil index of tightness",v=>v.toFixed(2));
  ["Sale","Rent"].forEach(ten=>{const g=rows.filter(r=>r.tenure===ten).sort((a,b)=>a.year-b.year);
    poly(svg,g.map(r=>[X(r.year),Y(r.theil)]),COL[ten].f,2.6);
    g.forEach(r=>svg.appendChild(el("circle",{cx:X(r.year),cy:Y(r.theil),r:3,fill:COL[ten].f,stroke:"#fff","stroke-width":.8})));});
  $("legend").innerHTML=`<span><i style="border-color:#6aa0d8"></i>Sale</span><span><i style="border-color:#a98fd0"></i>Rent</span>`;
  $("note").innerHTML=`The Theil index measures how unevenly tightness is spread across travel-to-work areas: higher means more unequal. Sale-market inequality dipped to a trough in 2021, when the pandemic pressed on housing everywhere at once, then surged to a 2025 high as the map pulled apart again. Rental inequality rose more persistently. A higher value is genuine spatial divergence, not a uniform national move.`;}

function drawReg(){const {svg,W,H}=frame();const mL=58,mR=18,mT=26,mB=44;
  const all=D.regions;const series=Object.entries(all).map(([rg,byt])=>({rg,rows:byt[tenure]||[]})).filter(s=>s.rows.length);
  const vals=series.flatMap(s=>s.rows.map(r=>r.theta));const hi=Math.max(...vals)*1.08,lo=0;
  const {X,Y}=axes(svg,W,H,mL,mR,mT,mB,lo,hi,2016,2025,"Tightness (demand ÷ supply)",v=>v.toFixed(0));
  series.forEach(s=>{if(s.rg===region)return;poly(svg,s.rows.map(r=>[X(r.year),Y(r.theta)]),"#c9bda6",1.4,.8);});
  const sel=series.find(s=>s.rg===region);
  if(sel){poly(svg,sel.rows.map(r=>[X(r.year),Y(r.theta)]),"#7a4b2b",3);
    sel.rows.forEach(r=>svg.appendChild(el("circle",{cx:X(r.year),cy:Y(r.theta),r:3.4,fill:"#7a4b2b",stroke:"#fff","stroke-width":1})));
    const last=sel.rows[sel.rows.length-1];svg.appendChild(el("text",{x:X(last.year)-4,y:Y(last.theta)-8,"text-anchor":"end","font-size":11,fill:"#7a4b2b","font-family":"Georgia,serif"},region));}
  $("legend").innerHTML=`<span><i style="border-color:#7a4b2b"></i>${region}</span><span><i style="border-color:#c9bda6"></i>Other regions</span>`;
  $("note").innerHTML=`Each faint line is a region's demand-weighted average tightness; the highlighted line is the one you choose. Before the pandemic London and the South East were the tightest markets. They rose with everywhere else in 2020–21, then fell back faster, so by 2025 several northern regions are tighter than the South. That reordering is the regional divergence behind the rise in inequality. Values are averages over the ${sel?sel.rows[sel.rows.length-1].n:''} travel-to-work areas in the region; ${tenure.toLowerCase()} market.`;}

function draw(){ view==="ineq"?drawIneq():drawReg(); }
</script>
<script data-pageviews="1">
(function () {
  if (window.__pageviews) return;
  window.__pageviews = true;
  var CODE = "helenxhbao";
  var BASE = "https://" + CODE + ".goatcounter.com/counter/";

  // GoatCounter answers with a JSON body even when it replies 404, which is what
  // it does for a path that has had no views yet, so the body is read regardless
  // of status. Returns {n, text} with the count as a number and as GoatCounter's
  // own formatted string, which carries the thousands separators.
  function read(url) {
    return fetch(url, { mode: "cors" })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (d) {
        if (!d || d.count === undefined || d.count === null) return { n: 0, text: null };
        var n = parseInt(String(d.count).replace(/[^0-9]/g, ""), 10);
        return { n: isNaN(n) ? 0 : n, text: String(d.count) };
      })
      .catch(function () { return { n: 0, text: null }; });
  }

  // The documented path form keeps its leading slash, which leaves a double
  // slash after /counter/. The undoubled form also answers, so if the documented
  // one comes back empty the other is tried before giving up.
  function pageCount(path) {
    return read(BASE + path + ".json").then(function (a) {
      if (a.n > 0) return a;
      return read(BASE + path.replace(/^[/]/, "") + ".json");
    });
  }

  function render() {
    var host = document.querySelector("article") ||
               document.querySelector(".center") ||
               document.body;
    if (!host) return;
    var old = document.querySelector(".pageviews");
    if (old) old.remove();

    var path = location.pathname.replace(/index[.]html$/, "");
    if (path.length > 1) path = path.replace(/[/]$/, "");
    var isHome = path === "/" || path === "";

    var jobs = [pageCount(isHome ? "/" : path)];
    if (isHome) jobs.push(read(BASE + "TOTAL.json"));

    Promise.all(jobs).then(function (res) {
      var parts = [];
      if (res[0].n > 0) parts.push(res[0].text + " views of this page");
      if (isHome && res[1] && res[1].n > 0) parts.push(res[1].text + " views across the site");
      if (!parts.length) return;   // nothing recorded yet: show nothing at all
      var el = document.createElement("p");
      el.className = "pageviews";
      el.setAttribute("aria-live", "polite");
      el.textContent = parts.join(" · ");
      host.appendChild(el);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render);
  } else {
    render();
  }
  document.addEventListener("nav", render);
})();
</script></body>
</html>
