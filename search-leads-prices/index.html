<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search as a leading indicator of prices</title>
<style>
  :root{--paper:#fbf8f2;--ink:#1c1b18;--terra:#7a4b2b;--muted:#6b6355;--hair:#d9d2c5;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Spectral",Georgia,"Times New Roman",serif;line-height:1.5;}
  .wrap{max-width:820px;margin:0 auto;padding:12px 14px 22px;}
  h1{font-size:1.3rem;margin:.2rem 0 .1rem;}
  .sub{color:var(--muted);margin:.1rem 0 .8rem;max-width:70ch;}
  .controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px;}
  .ctl{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);}
  .seg{display:inline-flex;border:1px solid var(--hair);border-radius:4px;overflow:hidden;}
  .seg button{font-family:inherit;font-size:.85rem;padding:5px 13px;border:0;background:var(--paper);color:var(--ink);cursor:pointer;}
  .seg button.on{background:var(--terra);color:#fff;}
  #chart{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:18px;font-size:.85rem;margin:6px 2px 0;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:20px;height:0;border-top:3px solid;display:inline-block;}
  .note{font-size:.78rem;color:var(--muted);margin:8px 2px 0;max-width:84ch;line-height:1.45;}
  .tip{position:fixed;pointer-events:none;background:#fffdf8;border:1px solid var(--hair);border-radius:3px;padding:6px 8px;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.12);opacity:0;transition:opacity .08s;z-index:20;}
  body.embed h1,body.embed .sub{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Search as a leading indicator of prices</h1>
  <p class="sub">Does housing-market tightness today predict price changes tomorrow?</p>
  <div class="controls">
    <div class="ctl">View<div class="seg" id="segView">
      <button data-v="lead" class="on">Does tightness lead prices?</button><button data-v="now">Early-warning test</button></div></div>
  </div>
  <svg id="chart" viewBox="0 0 720 400" role="img" aria-label="Leading-indicator evidence"></svg>
  <div class="legend" id="legend"></div>
  <div class="note" id="note"></div>
</div>
<div class="tip" id="tip"></div>
<script>
const $=id=>document.getElementById(id);
if(location.hash.includes("embed")||location.search.includes("embed"))document.body.classList.add("embed");
const NS="http://www.w3.org/2000/svg";
function el(n,a,t){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e;}
let D=null,view="lead";
fetch("data/p3.json?v=1").then(r=>r.json()).then(d=>{D=d;
  $("segView").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;
    $("segView").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));draw();});
  draw();});

function frame(W,H,mL,mR,mT,mB){const svg=$("chart");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML="";
  svg.appendChild(el("rect",{x:1,y:1,width:W-2,height:H-2,rx:12,fill:"#fbf8f2",stroke:"#e4d8c4","stroke-width":1.5}));return svg;}

function drawLead(){
  const W=720,H=400,mL=64,mR=20,mT=28,mB=64,pT=mT,pB=H-mB,svg=frame(W,H,mL,mR,mT,mB);
  const hs=D.horizons, n=hs.length, slot=(W-mL-mR)/n;
  const X=i=>mL+(i+0.5)*slot;
  const vals=hs.flatMap(h=>[h.beta-1.96*h.se,h.beta+1.96*h.se]).concat([0]);
  let lo=Math.min(...vals),hi=Math.max(...vals);const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;
  const Y=v=>pT+(1-(v-lo)/(hi-lo))*(pB-pT);
  // y grid
  const step=0.02;for(let v=Math.ceil(lo/step)*step;v<=hi;v+=step){const gy=Y(v),z=Math.abs(v)<1e-9;
    svg.appendChild(el("line",{x1:mL,y1:gy,x2:W-mR,y2:gy,stroke:z?"#c9bda6":"#ece5d5","stroke-width":z?1.4:1,"stroke-dasharray":z?"4 3":""}));
    svg.appendChild(el("text",{x:mL-8,y:gy+3,"text-anchor":"end","font-size":11,fill:"#6b6355","font-family":"Georgia,serif"},v.toFixed(2)));}
  svg.appendChild(el("text",{x:16,y:(pT+pB)/2,"text-anchor":"middle","font-size":11,fill:"#6b6355","font-family":"Georgia,serif",transform:`rotate(-90 16 ${(pT+pB)/2})`},"Effect on future price growth (β)"));
  hs.forEach((h,i)=>{const x=X(i),sig=(h.beta-1.96*h.se>0);const c=sig?"#7a4b2b":"#b0a68c";
    svg.appendChild(el("line",{x1:x,y1:Y(h.beta-1.96*h.se),x2:x,y2:Y(h.beta+1.96*h.se),stroke:c,"stroke-width":2}));
    svg.appendChild(el("line",{x1:x-5,y1:Y(h.beta-1.96*h.se),x2:x+5,y2:Y(h.beta-1.96*h.se),stroke:c,"stroke-width":2}));
    svg.appendChild(el("line",{x1:x-5,y1:Y(h.beta+1.96*h.se),x2:x+5,y2:Y(h.beta+1.96*h.se),stroke:c,"stroke-width":2}));
    svg.appendChild(el("circle",{cx:x,cy:Y(h.beta),r:5,fill:c,stroke:"#fff","stroke-width":1.2}));
    svg.appendChild(el("text",{x:x,y:pB+20,"text-anchor":"middle","font-size":12,fill:"#1c1b18","font-family":"Georgia,serif"},h.label));
    svg.appendChild(el("text",{x:x,y:pB+36,"text-anchor":"middle","font-size":10.5,fill:sig?"#7a4b2b":"#8a7358","font-family":"Georgia,serif"},sig?"significant":"not significant"));
  });
  $("legend").innerHTML=`<span><i style="border-color:#7a4b2b"></i>Positive and significant</span><span><i style="border-color:#b0a68c"></i>Not distinguishable from zero</span>`;
  $("note").innerHTML=`Each point is the estimated effect of current housing-market tightness on price growth a given number of years later (travel-to-work areas, area and year fixed effects, 2010–2025). The effect is positive and excludes zero one and two years ahead, and it is larger at the longer horizon, so tightness leads prices by one to two years. The same-year effect is weaker, and the reverse regression (past price growth predicting today's tightness) is not significant (t = ${D.reverse.t.toFixed(1)}), so the lead runs from search to prices, not the other way. The dashed line marks zero.`;
}

function drawNowcast(){
  const W=720,H=400,mL=64,mR=20,mT=28,mB=48,pT=mT,pB=H-mB,svg=frame(W,H,mL,mR,mT,mB);
  const nc=D.nowcast, y0=nc[0].year, y1=nc[nc.length-1].year, slot=(W-mL-mR)/(y1-y0);
  const X=y=>mL+(y-y0)*slot;
  const vals=nc.flatMap(d=>[d.ar,d.ar_theta]);let lo=0,hi=Math.max(...vals)*1.08;
  const Y=v=>pT+(1-(v-lo)/(hi-lo))*(pB-pT);
  for(let i=0;i<=5;i++){const v=hi*i/5,gy=Y(v);
    svg.appendChild(el("line",{x1:mL,y1:gy,x2:W-mR,y2:gy,stroke:"#ece5d5","stroke-width":1}));
    svg.appendChild(el("text",{x:mL-8,y:gy+3,"text-anchor":"end","font-size":11,fill:"#6b6355","font-family":"Georgia,serif"},v.toFixed(2)));}
  svg.appendChild(el("text",{x:16,y:(pT+pB)/2,"text-anchor":"middle","font-size":11,fill:"#6b6355","font-family":"Georgia,serif",transform:`rotate(-90 16 ${(pT+pB)/2})`},"Forecast error (RMSE, lower is better)"));
  // pandemic band
  svg.appendChild(el("rect",{x:X(2020),y:pT,width:X(2021)-X(2020),height:pB-pT,fill:"#7a4b2b",opacity:.05}));
  svg.appendChild(el("text",{x:(X(2020)+X(2021))/2,y:pT+11,"text-anchor":"middle","font-size":11,fill:"#8a7358","font-family":"Georgia,serif"},"2020–21"));
  nc.forEach(d=>svg.appendChild(el("text",{x:X(d.year),y:pB+18,"text-anchor":"middle","font-size":11,fill:"#6b6355","font-family":"Georgia,serif"},d.year)));
  const line=(key,color)=>{svg.appendChild(el("path",{d:nc.map((d,i)=>(i?"L":"M")+X(d.year).toFixed(1)+" "+Y(d[key]).toFixed(1)).join(" "),fill:"none",stroke:color,"stroke-width":2.6,"stroke-linejoin":"round"}));
    nc.forEach(d=>svg.appendChild(el("circle",{cx:X(d.year),cy:Y(d[key]),r:3.4,fill:color,stroke:"#fff","stroke-width":1})));};
  line("ar","#b0a68c");line("ar_theta","#7a4b2b");
  nc.forEach(d=>{const hit=el("rect",{x:X(d.year)-slot/2,y:pT,width:slot,height:pB-pT,fill:"transparent"});
    hit.onmousemove=e=>{const win=d.ar_theta<d.ar;const tip=$("tip");
      tip.innerHTML=`<strong>${d.year}</strong><br>Baseline: ${d.ar.toFixed(3)}<br>With tightness: ${d.ar_theta.toFixed(3)}<br>${win?"signal helps":"signal does not help"}`;
      tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,window.innerWidth-180)+"px";tip.style.top=(e.clientY+14)+"px";};
    hit.onmouseleave=()=>{$("tip").style.opacity=0;};svg.appendChild(hit);});
  $("legend").innerHTML=`<span><i style="border-color:#b0a68c"></i>Baseline forecast (no signal)</span><span><i style="border-color:#7a4b2b"></i>Forecast plus the tightness signal</span>`;
  $("note").innerHTML=`An out-of-sample test: each year is held out and predicted from the past, once from a simple momentum baseline and once from the same baseline plus the tightness signal. Lower is better. The signal helps most in the turbulent pandemic years, when prices turned (2020 and 2021), and adds little in calmer years. It is an early-warning aid at turning points, not a uniform improvement.`;
}

function draw(){ view==="lead"?drawLead():drawNowcast(); }
</script>
<script data-pageviews="1">
(function () {
  if (window.__pageviews) return;
  window.__pageviews = true;
  var CODE = "helenxhbao";
  var BASE = "https://" + CODE + ".goatcounter.com/counter/";

  // GoatCounter answers with a JSON body even when it replies 404, which is what
  // it does for a path that has had no views yet, so the body is read regardless
  // of status. Returns {n, text} with the count as a number and as GoatCounter's
  // own formatted string, which carries the thousands separators.
  function read(url) {
    return fetch(url, { mode: "cors" })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (d) {
        if (!d || d.count === undefined || d.count === null) return { n: 0, text: null };
        var n = parseInt(String(d.count).replace(/[^0-9]/g, ""), 10);
        return { n: isNaN(n) ? 0 : n, text: String(d.count) };
      })
      .catch(function () { return { n: 0, text: null }; });
  }

  // The documented path form keeps its leading slash, which leaves a double
  // slash after /counter/. The undoubled form also answers, so if the documented
  // one comes back empty the other is tried before giving up.
  function pageCount(path) {
    return read(BASE + path + ".json").then(function (a) {
      if (a.n > 0) return a;
      return read(BASE + path.replace(/^[/]/, "") + ".json");
    });
  }

  function render() {
    var host = document.querySelector("article") ||
               document.querySelector(".center") ||
               document.body;
    if (!host) return;
    var old = document.querySelector(".pageviews");
    if (old) old.remove();

    var path = location.pathname.replace(/index[.]html$/, "");
    if (path.length > 1) path = path.replace(/[/]$/, "");
    var isHome = path === "/" || path === "";

    var jobs = [pageCount(isHome ? "/" : path)];
    if (isHome) jobs.push(read(BASE + "TOTAL.json"));

    Promise.all(jobs).then(function (res) {
      var parts = [];
      if (res[0].n > 0) parts.push(res[0].text + " views of this page");
      if (isHome && res[1] && res[1].n > 0) parts.push(res[1].text + " views across the site");
      if (!parts.length) return;   // nothing recorded yet: show nothing at all
      var el = document.createElement("p");
      el.className = "pageviews";
      el.setAttribute("aria-live", "polite");
      el.textContent = parts.join(" · ");
      host.appendChild(el);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render);
  } else {
    render();
  }
  document.addEventListener("nav", render);
})();
</script></body>
</html>
