<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Housing Demand by Town Type and Growth Trajectory</title>
<style>
  :root{--paper:#fbf8f2;--ink:#1c1b18;--terra:#7a4b2b;--teal:#3f6b5f;--hair:#d9d2c5;--muted:#6b6355;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Spectral",Georgia,"Times New Roman",serif;line-height:1.45;}
  .wrap{max-width:1200px;margin:0 auto;padding:14px 16px 30px;}
  h1{font-size:1.5rem;margin:.2rem 0 .1rem;}
  .sub{color:var(--muted);margin:.1rem 0 1rem;max-width:72ch;}
  .controls{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
  .ctl{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);}
  select{font-family:inherit;font-size:.9rem;padding:4px 6px;border:1px solid var(--hair);
    border-radius:4px;background:var(--paper);color:var(--ink);}
  .seg{display:inline-flex;border:1px solid var(--hair);border-radius:4px;overflow:hidden;}
  .seg button{font-family:inherit;font-size:.85rem;padding:5px 14px;border:0;background:var(--paper);
    color:var(--ink);cursor:pointer;}
  .seg button.on{background:var(--terra);color:#fff;}
  table.grid{border-collapse:collapse;width:100%;table-layout:fixed;}
  table.grid th,table.grid td{padding:0;text-align:center;}
  col.lab{width:158px;}
  th.period{font-size:.9rem;font-weight:700;padding:2px 0 4px;}
  th.traj{font-size:.72rem;font-weight:600;color:var(--muted);padding:2px 0 5px;border-bottom:1px solid var(--hair);}
  th.fn{font-size:.72rem;font-weight:600;text-align:right;padding:2px 8px 2px 0;line-height:1.12;}
  th.band{text-align:left;font-size:.95rem;font-weight:700;padding:9px 0 4px 2px;color:var(--terra);}
  td.cell{height:30px;font-size:.8rem;font-variant-numeric:tabular-nums;cursor:default;border:1px solid var(--paper);}
  td.blank{color:#c3bbab;background:#f4efe6;}
  .grp{border-left:2px solid var(--paper);}
  .legend{margin-top:12px;font-size:.82rem;color:var(--muted);display:flex;gap:26px;flex-wrap:wrap;align-items:flex-start;}
  .legbar{min-width:220px;}
  .legend .bar{height:12px;border-radius:2px;margin:4px 0 3px;}
  .legend .ends{display:flex;justify-content:space-between;font-variant-numeric:tabular-nums;}
  .legend .desc{max-width:52ch;}
  .tip{position:fixed;pointer-events:none;background:#fffdf8;border:1px solid var(--hair);border-radius:3px;
    padding:6px 8px;font-size:.78rem;max-width:250px;box-shadow:0 2px 8px rgba(0,0,0,.12);opacity:0;transition:opacity .08s;z-index:20;}
  body.embed h1,body.embed .sub{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Housing Demand by Town Type and Growth Trajectory</h1>
  <p class="sub">Revealed search demand across Britain's travel-to-work areas, grouped by economic function (rows) and by population trajectory (columns), before, during, and after the pandemic.</p>
  <div class="controls">
    <div class="ctl">Index<select id="selIndex"></select></div>
    <div class="ctl">View<div class="seg" id="segView">
      <button data-v="levels" class="on">Levels</button><button data-v="change">Change</button></div></div>
    <div class="ctl">Tenure<div class="seg" id="segTenure">
      <button data-v="both" class="on">Both</button><button data-v="Sale">Sale</button><button data-v="Rent">Rent</button></div></div>
  </div>
  <div id="grids"></div>
  <div class="legend" id="legend"></div>
</div>
<div class="tip" id="tip"></div>
<script>
const $=id=>document.getElementById(id);
if(location.hash.includes("embed")||location.search.includes("embed"))document.body.classList.add("embed");

const PERIODS=[["before","Before","2016–2019"],["during","During","2020–2021"],["after","After","2022–2025"]];
const PLAB={before:"Before (2016–2019)",during:"During (2020–2021)",after:"After (2022–2025)"};
const STEPS=[["during","before","During − Before"],["after","during","After − During"]];
const TENURES=["Sale","Rent"];
const FN_ORDER=["Global financial capital","Devolved/administrative capital","Regenerating core city","Knowledge & professional-service hub","Diversified medium-sized town","Manufacturing & post-industrial town","Coastal / amenity & retirement","Mixed / smaller towns (function unclassified)"];
const FN_LABEL={"Global financial capital":"Global financial capital","Devolved/administrative capital":"Devolved / administrative capital","Regenerating core city":"Regenerating core city","Knowledge & professional-service hub":"Knowledge & professional-service hub","Diversified medium-sized town":"Diversified medium-sized town","Manufacturing & post-industrial town":"Manufacturing & post-industrial town","Coastal / amenity & retirement":"Coastal / amenity & retirement","Mixed / smaller towns (function unclassified)":"Mixed / smaller towns"};
const TRAJ=["Growing","Stable","Declining"];
const INDICES=[
  ["netflow","Net-flow","div","Red = net source (more search leaves than arrives); blue = net sink. Change: teal = became more of a sink, terracotta = more of a source."],
  ["leaving","Leaving rate","seq","Share of residents' search pointing outside their area."],
  ["openness","Openness","seq","Share of the area's search that crosses its boundary."],
  ["reach_km","Reach (km)","seq","Mean distance residents look when searching beyond home."],
  ["hhi","Concentration","seq","How funnelled residents' outward search is (Herfindahl)."],
];
const IMETA=Object.fromEntries(INDICES.map(([k,l,kind,desc])=>[k,{label:l,kind,desc}]));

let index="netflow",view="levels",tenSel="both";

function parseCSV(t){const r=[];let f=[],c="",q=false;for(let i=0;i<t.length;i++){const ch=t[i];
  if(q){if(ch=='"'){if(t[i+1]=='"'){c+='"';i++;}else q=false;}else c+=ch;}
  else{if(ch=='"')q=true;else if(ch==','){f.push(c);c="";}
  else if(ch=='\n'||ch=='\r'){if(ch=='\r'&&t[i+1]=='\n')i++;f.push(c);r.push(f);f=[];c="";}else c+=ch;}}
  if(c!==""||f.length){f.push(c);r.push(f);}return r;}
function toObjects(t){const rows=parseCSV(t).filter(r=>r.length>1);const h=rows[0];
  return rows.slice(1).map(r=>Object.fromEntries(h.map((k,i)=>[k,r[i]])));}
function hx(h){return[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];}
function mix(a,b,t){return"rgb("+a.map((v,i)=>Math.round(v+(b[i]-v)*t)).join(",")+")";}
const RED=hx("#b5482f"),PALE=hx("#efe9dc"),BLUE=hx("#3f6b6f"),PALEs=hx("#f2ead9"),TERRA=hx("#7a4b2b"),TEAL=hx("#3f6b5f");
function seqColor(t){return mix(PALEs,TERRA,t);}
function nfColor(t){return t<.5?mix(RED,PALE,t/.5):mix(PALE,BLUE,(t-.5)/.5);}
function chColor(t){return t<.5?mix(TERRA,PALE,t/.5):mix(PALE,TEAL,(t-.5)/.5);}
function lum(rgb){const m=rgb.match(/\d+/g).map(Number);return(0.299*m[0]+0.587*m[1]+0.114*m[2])/255;}

let G={},LEVDOM={},CHGDOM={};
function build(rows){
  rows.forEach(r=>{const v=r.value===""?null:+r.value;
    (((((G[r.tenure]=G[r.tenure]||{})[r.period]=G[r.tenure][r.period]||{})[r.index]=G[r.tenure][r.period][r.index]||{})[r.function]=
      G[r.tenure][r.period][r.index][r.function]||{}))[r.trajectory]={v,n:+r.n,ex:r.exemplars};});
  INDICES.forEach(([k])=>{
    if(k==="netflow")LEVDOM[k]=[-0.5,0.5]; else {let mx=0;rows.filter(r=>r.index===k&&r.value!=="").forEach(r=>mx=Math.max(mx,+r.value));LEVDOM[k]=[0,mx||1];}
    // change domain: symmetric max |step delta|
    let m=0;
    TENURES.forEach(te=>STEPS.forEach(([p2,p1])=>FN_ORDER.forEach(fn=>TRAJ.forEach(tr=>{
      const a=cell(te,p2,k,fn,tr),b=cell(te,p1,k,fn,tr);
      if(a&&b&&a.v!=null&&b.v!=null)m=Math.max(m,Math.abs(a.v-b.v));
    }))));
    CHGDOM[k]=m||1;
  });
}
function cell(te,pe,ix,fn,tr){return((((G[te]||{})[pe]||{})[ix]||{})[fn]||{})[tr];}
function fmt(k,v,signed){if(v==null)return"";const s=signed&&v>0?"+":"";
  if(k==="reach_km")return s+Math.round(v);return s+v.toFixed(2);}
function levColor(v){const kind=IMETA[index].kind,[a,b]=LEVDOM[index];let t=(v-a)/(b-a);t=Math.max(0,Math.min(1,t));
  return kind==="div"?nfColor(t):seqColor(t);}
function chgColorOf(d){const M=CHGDOM[index];let t=(d+M)/(2*M);t=Math.max(0,Math.min(1,t));return chColor(t);}

function cellHTML(bg,txt,ds){const tc=lum(bg)<0.55?"#fff":"#1c1b18";
  return `<td class="cell${ds.grp?' grp':''}" style="background:${bg};color:${tc}" ${ds.attrs}>${txt}</td>`;}
function blankHTML(grp){return `<td class="cell blank${grp?' grp':''}">–</td>`;}

function tenureBand(te){
  const cols=view==="levels"?PERIODS:STEPS;
  let h=`<tr><th class="band" colspan="${1+cols.length*3}">${te}</th></tr>`;
  FN_ORDER.forEach(fn=>{
    h+=`<tr><th class="fn" title="${fn}">${FN_LABEL[fn]}</th>`;
    cols.forEach((c,ci)=>{
      TRAJ.forEach((tr,ti)=>{
        const grp=ci>0&&ti===0;
        if(view==="levels"){
          const cl=cell(te,c[0],index,fn,tr);
          if(!cl||cl.v==null){h+=blankHTML(grp);return;}
          const attrs=`data-html="${enc(`<strong>${FN_LABEL[fn]}</strong>, ${tr}<br>${PLAB[c[0]]}, ${te}<br>${IMETA[index].label}: ${fmt(index,cl.v)}<br>${cl.n} area${cl.n==1?'':'s'}${cl.ex?': '+cl.ex:''}`)}"`;
          h+=cellHTML(levColor(cl.v),fmt(index,cl.v),{grp,attrs});
        }else{
          const a=cell(te,c[0],index,fn,tr),b=cell(te,c[1],index,fn,tr);
          if(!a||!b||a.v==null||b.v==null){h+=blankHTML(grp);return;}
          const d=a.v-b.v;
          const attrs=`data-html="${enc(`<strong>${FN_LABEL[fn]}</strong>, ${tr}<br>${c[2]}, ${te}<br>Δ ${IMETA[index].label}: ${fmt(index,d,true)}<br>(${fmt(index,b.v)} → ${fmt(index,a.v)})`)}"`;
          h+=cellHTML(chgColorOf(d),fmt(index,d,true),{grp,attrs});
        }
      });
    });
    h+='</tr>';
  });
  return h;
}
function enc(s){return s.replace(/"/g,'&quot;');}

function draw(){
  const cols=view==="levels"?PERIODS:STEPS;
  let head=`<colgroup><col class="lab">`+cols.map(()=>`<col><col><col>`).join("")+`</colgroup>`;
  head+=`<tr><th></th>`+cols.map(c=>`<th class="period" colspan="3">${view==="levels"?c[1]+' <span style="font-weight:400;color:var(--muted);font-size:.8em">'+c[2]+'</span>':c[2]}</th>`).join("")+`</tr>`;
  head+=`<tr><th></th>`+cols.map(()=>TRAJ.map((t,i)=>`<th class="traj${i===0?' grp':''}">${t}</th>`).join("")).join("")+`</tr>`;
  const tens=tenSel==="both"?TENURES:[tenSel];
  let body=tens.map(tenureBand).join("");
  $("grids").innerHTML=`<table class="grid">${head}${body}</table>`;
  // legend
  let bar,ends,a,b;
  if(view==="levels"){const kind=IMETA[index].kind;[a,b]=LEVDOM[index];
    const stops=[];for(let i=0;i<=10;i++){const t=i/10;stops.push(kind==="div"?nfColor(t):seqColor(t));}
    bar=`<div class="bar" style="background:linear-gradient(90deg,${stops.join(",")})"></div>`;
    ends=`<span>${fmt(index,a)}</span>${kind==="div"?"<span>0</span>":""}<span>${fmt(index,b)}</span>`;
  }else{const M=CHGDOM[index];const stops=[];for(let i=0;i<=10;i++)stops.push(chColor(i/10));
    bar=`<div class="bar" style="background:linear-gradient(90deg,${stops.join(",")})"></div>`;
    ends=`<span>−${fmt(index,M)}</span><span>0</span><span>+${fmt(index,M)}</span>`;
  }
  const title=view==="levels"?IMETA[index].label:("Change in "+IMETA[index].label.toLowerCase());
  $("legend").innerHTML=`<div class="legbar"><div><strong>${title}</strong></div>${bar}<div class="ends">${ends}</div></div>`+
    `<div class="desc">${IMETA[index].desc}${view==="change"?" Terracotta = decrease, teal = increase between the two periods; each column is a step change.":""} Empty cells contain no area of that combination.</div>`;
  // tooltips
  document.querySelectorAll("#grids td.cell:not(.blank)").forEach(td=>{
    td.onmousemove=e=>{const tip=$("tip");tip.innerHTML=td.getAttribute("data-html");tip.style.opacity=1;
      tip.style.left=Math.min(e.clientX+14,window.innerWidth-260)+"px";tip.style.top=(e.clientY+14)+"px";};
    td.onmouseleave=()=>{$("tip").style.opacity=0;};
  });
}

function wireSeg(id,cb){$(id).querySelectorAll("button").forEach(b=>b.onclick=()=>{
  $(id).querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));cb(b.dataset.v);});}

fetch("data/typology_grid.csv").then(r=>r.text()).then(t=>{
  build(toObjects(t));
  $("selIndex").innerHTML=INDICES.map(([k,l])=>`<option value="${k}">${l}</option>`).join("");
  $("selIndex").onchange=()=>{index=$("selIndex").value;draw();};
  wireSeg("segView",v=>{view=v;draw();});
  wireSeg("segTenure",v=>{tenSel=v;draw();});
  draw();
});
</script>
<script data-pageviews="1">
(function () {
  if (window.__pageviews) return;
  window.__pageviews = true;
  var CODE = "helenxhbao";
  var BASE = "https://" + CODE + ".goatcounter.com/counter/";

  // GoatCounter answers with a JSON body even when it replies 404, which is what
  // it does for a path that has had no views yet, so the body is read regardless
  // of status. Returns {n, text} with the count as a number and as GoatCounter's
  // own formatted string, which carries the thousands separators.
  function read(url) {
    return fetch(url, { mode: "cors" })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (d) {
        if (!d || d.count === undefined || d.count === null) return { n: 0, text: null };
        var n = parseInt(String(d.count).replace(/[^0-9]/g, ""), 10);
        return { n: isNaN(n) ? 0 : n, text: String(d.count) };
      })
      .catch(function () { return { n: 0, text: null }; });
  }

  // The documented path form keeps its leading slash, which leaves a double
  // slash after /counter/. The undoubled form also answers, so if the documented
  // one comes back empty the other is tried before giving up.
  function pageCount(path) {
    return read(BASE + path + ".json").then(function (a) {
      if (a.n > 0) return a;
      return read(BASE + path.replace(/^[/]/, "") + ".json");
    });
  }

  function render() {
    var host = document.querySelector("article") ||
               document.querySelector(".center") ||
               document.body;
    if (!host) return;
    var old = document.querySelector(".pageviews");
    if (old) old.remove();

    var path = location.pathname.replace(/index[.]html$/, "");
    if (path.length > 1) path = path.replace(/[/]$/, "");
    var isHome = path === "/" || path === "";

    var jobs = [pageCount(isHome ? "/" : path)];
    if (isHome) jobs.push(read(BASE + "TOTAL.json"));

    Promise.all(jobs).then(function (res) {
      var parts = [];
      if (res[0].n > 0) parts.push(res[0].text + " views of this page");
      if (isHome && res[1] && res[1].n > 0) parts.push(res[1].text + " views across the site");
      if (!parts.length) return;   // nothing recorded yet: show nothing at all
      var el = document.createElement("p");
      el.className = "pageviews";
      el.setAttribute("aria-live", "polite");
      el.textContent = parts.join(" · ");
      host.appendChild(el);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render);
  } else {
    render();
  }
  document.addEventListener("nav", render);
})();
</script></body>
</html>
