<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flood risk and the intent-to-move wedge</title>
<style>
  :root{--paper:#f2f7fb;--ink:#1c1b18;--accent:#2f6d9e;--accent2:#9bb9d2;--muted:#5c6672;--hair:#cfdbe6;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Spectral",Georgia,"Times New Roman",serif;line-height:1.5;}
  .wrap{max-width:820px;margin:0 auto;padding:12px 14px 22px;}
  h1{font-size:1.3rem;margin:.2rem 0 .1rem;}
  .sub{color:var(--muted);margin:.1rem 0 .8rem;max-width:70ch;}
  .controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px;}
  .ctl{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);}
  .seg{display:inline-flex;border:1px solid var(--hair);border-radius:4px;overflow:hidden;}
  .seg button{font-family:inherit;font-size:.85rem;padding:5px 13px;border:0;background:#fff;color:var(--ink);cursor:pointer;}
  .seg button.on{background:var(--accent);color:#fff;}
  #chart{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:18px;font-size:.85rem;margin:6px 2px 0;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:20px;height:0;border-top:3px solid;display:inline-block;}
  .note{font-size:.78rem;color:var(--muted);margin:8px 2px 0;max-width:84ch;line-height:1.45;}
  .tip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--hair);border-radius:3px;padding:6px 8px;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.12);opacity:0;transition:opacity .08s;z-index:20;}
  body.embed h1,body.embed .sub{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Flood risk and the intent-to-move wedge</h1>
  <p class="sub">After a flood, does the housing market move? Six major fluvial floods, 2019–2024, compared within the same towns.</p>
  <div class="controls">
    <div class="ctl">View<div class="seg" id="segView">
      <button data-v="demand" class="on">Demand for flooded homes</button><button data-v="split">Supply or demand?</button><button data-v="prices">Do prices follow?</button></div></div>
  </div>
  <svg id="chart" viewBox="0 0 720 400" role="img" aria-label="Flood event-study evidence"></svg>
  <div class="legend" id="legend"></div>
  <div class="note" id="note"></div>
</div>
<div class="tip" id="tip"></div>
<script>
const $=id=>document.getElementById(id);
if(location.hash.includes("embed")||location.search.includes("embed"))document.body.classList.add("embed");
const NS="http://www.w3.org/2000/svg";
const AC="#2f6d9e", AC2="#9bb9d2", GREY="#b6bcc4";
function el(n,a,t){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e;}
let D=null,view="demand";
fetch("data/flood.json?v=1").then(r=>r.json()).then(d=>{D=d;
  $("segView").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;
    $("segView").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));draw();});
  draw();});

function frame(W,H){const svg=$("chart");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML="";
  svg.appendChild(el("rect",{x:1,y:1,width:W-2,height:H-2,rx:12,fill:"#fff",stroke:"#e2ebf3","stroke-width":1.5}));return svg;}
function yaxis(svg,mL,W,mR,Y,lo,hi,step,fmt){for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step){const gy=Y(v),z=Math.abs(v)<1e-9;
  svg.appendChild(el("line",{x1:mL,y1:gy,x2:W-mR,y2:gy,stroke:z?"#a9b6c3":"#eaf0f5","stroke-width":z?1.4:1,"stroke-dasharray":z?"4 3":""}));
  svg.appendChild(el("text",{x:mL-8,y:gy+3,"text-anchor":"end","font-size":11,fill:"#5c6672","font-family":"Georgia,serif"},fmt(v)));}}

// event-study of one spec: connected line + 95% CI ribbon over months -6..+6
function drawES(spec, colr, ylab){
  const W=720,H=400,mL=66,mR=20,mT=26,mB=52,pT=mT,pB=H-mB,svg=frame(W,H);
  const P=spec.points, xs=P.map(p=>p.rel);
  const xlo=Math.min(...xs), xhi=Math.max(...xs);
  const X=v=>mL+((v-xlo)/(xhi-xlo))*(W-mL-mR);
  const all=P.flatMap(p=>[p.beta-1.96*p.se,p.beta+1.96*p.se]).concat([0]);
  let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*0.12;lo-=pad;hi+=pad;
  const Y=v=>pT+(1-(v-lo)/(hi-lo))*(pB-pT);
  yaxis(svg,mL,W,mR,Y,lo,hi,0.05,v=>(v*100).toFixed(0)+"%");
  svg.appendChild(el("text",{x:15,y:(pT+pB)/2,"text-anchor":"middle","font-size":11,fill:"#5c6672","font-family":"Georgia,serif",transform:`rotate(-90 15 ${(pT+pB)/2})`},ylab));
  // event marker at -0.5 (between -1 and 0)
  const ex=X(-0.5);
  svg.appendChild(el("line",{x1:ex,y1:pT,x2:ex,y2:pB,stroke:"#c0663a","stroke-width":1,"stroke-dasharray":"3 3"}));
  svg.appendChild(el("text",{x:ex+3,y:pT+11,"font-size":10.5,fill:"#c0663a","font-family":"Georgia,serif"},"flood"));
  // CI ribbon
  const up=P.map(p=>`${X(p.rel).toFixed(1)} ${Y(p.beta+1.96*p.se).toFixed(1)}`);
  const dn=P.map(p=>`${X(p.rel).toFixed(1)} ${Y(p.beta-1.96*p.se).toFixed(1)}`).reverse();
  svg.appendChild(el("polygon",{points:up.concat(dn).join(" "),fill:colr,opacity:.14}));
  svg.appendChild(el("path",{d:P.map((p,i)=>(i?"L":"M")+X(p.rel).toFixed(1)+" "+Y(p.beta).toFixed(1)).join(" "),fill:"none",stroke:colr,"stroke-width":2.6,"stroke-linejoin":"round"}));
  P.forEach(p=>{svg.appendChild(el("circle",{cx:X(p.rel),cy:Y(p.beta),r:3.4,fill:colr,stroke:"#fff","stroke-width":1}));
    const hit=el("rect",{x:X(p.rel)-9,y:pT,width:18,height:pB-pT,fill:"transparent"});
    hit.onmousemove=e=>{const tip=$("tip");tip.innerHTML=`<strong>month ${p.rel>=0?"+":""}${p.rel}</strong><br>${(p.beta*100).toFixed(1)}% (95% CI ${((p.beta-1.96*p.se)*100).toFixed(1)} to ${((p.beta+1.96*p.se)*100).toFixed(1)})`;
      tip.style.opacity=1;tip.style.left=Math.min(e.clientX+14,window.innerWidth-200)+"px";tip.style.top=(e.clientY+14)+"px";};
    hit.onmouseleave=()=>$("tip").style.opacity=0;svg.appendChild(hit);});
  xs.forEach(v=>svg.appendChild(el("text",{x:X(v),y:pB+18,"text-anchor":"middle","font-size":11,fill:"#5c6672","font-family":"Georgia,serif"},(v>0?"+":"")+v)));
  svg.appendChild(el("text",{x:(mL+W-mR)/2,y:pB+40,"text-anchor":"middle","font-size":11,fill:"#5c6672","font-family":"Georgia,serif"},"months since the flood"));
}

function drawDemand(){
  drawES(D.specs.eratio, AC, "Demand per listing, treated − control");
  $("legend").innerHTML=`<span><i style="border-color:${AC}"></i>Enquiries per active listing (flooded − same-town control)</span>`;
  $("note").innerHTML=`The outcome is buyer demand for flooded homes holding supply fixed: inbound enquiries divided by the stock of active listings, flooded postcodes against neighbours in the same towns, month by month around each flood (base month −1, dashed line = flood). Demand dips about a sixth at months +1 and +2, then reverts within a quarter. The band is the 95% confidence interval; inference on six events is conservative (event-level wild bootstrap p ≈ 0.07).`;
}
function drawSplit(){
  const W=720,H=400,mL=66,mR=140,mT=26,mB=52,pT=mT,pB=H-mB,svg=frame(W,H);
  const series=[["eratio","Enquiries per listing",AC],["enq","Total enquiries",AC2],["stock","Active listings",GREY]];
  const P0=D.specs.eratio.points, xs=P0.map(p=>p.rel), xlo=Math.min(...xs),xhi=Math.max(...xs);
  const X=v=>mL+((v-xlo)/(xhi-xlo))*(W-mL-mR);
  const all=series.flatMap(([k])=>D.specs[k].points.map(p=>p.beta)).concat([0]);
  let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*0.18;lo-=pad;hi+=pad;
  const Y=v=>pT+(1-(v-lo)/(hi-lo))*(pB-pT);
  yaxis(svg,mL,W,mR,Y,lo,hi,0.1,v=>(v*100).toFixed(0)+"%");
  const ex=X(-0.5);svg.appendChild(el("line",{x1:ex,y1:pT,x2:ex,y2:pB,stroke:"#c0663a","stroke-width":1,"stroke-dasharray":"3 3"}));
  svg.appendChild(el("text",{x:ex+3,y:pT+11,"font-size":10.5,fill:"#c0663a","font-family":"Georgia,serif"},"flood"));
  series.forEach(([k,lab,c],j)=>{const P=D.specs[k].points;
    svg.appendChild(el("path",{d:P.map((p,i)=>(i?"L":"M")+X(p.rel).toFixed(1)+" "+Y(p.beta).toFixed(1)).join(" "),fill:"none",stroke:c,"stroke-width":2.4,"stroke-linejoin":"round"}));
    P.forEach(p=>svg.appendChild(el("circle",{cx:X(p.rel),cy:Y(p.beta),r:2.8,fill:c})));
    svg.appendChild(el("text",{x:W-mR+8,y:pT+16+j*16,"font-size":11,fill:c,"font-family":"Georgia,serif"},"— "+lab));});
  xs.forEach(v=>svg.appendChild(el("text",{x:X(v),y:pB+18,"text-anchor":"middle","font-size":11,fill:"#5c6672","font-family":"Georgia,serif"},(v>0?"+":"")+v)));
  svg.appendChild(el("text",{x:(mL+W-mR)/2,y:pB+40,"text-anchor":"middle","font-size":11,fill:"#5c6672","font-family":"Georgia,serif"},"months since the flood"));
  $("legend").innerHTML="";
  $("note").innerHTML=`After a flood both inbound enquiries and active listings fall, because sellers withdraw as well as buyers pulling back, and the two are mechanically linked. The clean object is demand per available listing (the darkest line): it falls at +1 and +2 even though supply is held in the denominator, so buyers facing the same stock enquire less about flooded homes. The response is demand avoidance, not just a supply contraction.`;
}
function drawPrices(){
  const W=720,H=400,mL=66,mR=20,mT=30,mB=74,pT=mT,pB=H-mB,svg=frame(W,H);
  const rows=D.price;
  const slot=(W-mL-mR)/rows.length, X=i=>mL+(i+0.5)*slot;
  const all=rows.flatMap(d=>[d.lo,d.hi]).concat([0]);
  let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*0.15;lo-=pad;hi+=pad;
  const Y=v=>pT+(1-(v-lo)/(hi-lo))*(pB-pT);
  yaxis(svg,mL,W,mR,Y,lo,hi,0.05,v=>(v*100).toFixed(0)+"%");
  svg.appendChild(el("text",{x:15,y:(pT+pB)/2,"text-anchor":"middle","font-size":11,fill:"#5c6672","font-family":"Georgia,serif",transform:`rotate(-90 15 ${(pT+pB)/2})`},"Post-flood effect (treated − control)"));
  rows.forEach((d,i)=>{const x=X(i),sig=(d.lo>0||d.hi<0),c=sig?AC:GREY;
    svg.appendChild(el("line",{x1:x,y1:Y(d.lo),x2:x,y2:Y(d.hi),stroke:c,"stroke-width":2}));
    svg.appendChild(el("line",{x1:x-6,y1:Y(d.lo),x2:x+6,y2:Y(d.lo),stroke:c,"stroke-width":2}));
    svg.appendChild(el("line",{x1:x-6,y1:Y(d.hi),x2:x+6,y2:Y(d.hi),stroke:c,"stroke-width":2}));
    svg.appendChild(el("circle",{cx:x,cy:Y(d.coef),r:5,fill:c,stroke:"#fff","stroke-width":1.2}));
    const words=d.label.replace("{","(").replace("}",")").split(" ");
    svg.appendChild(el("text",{x:x,y:pB+20,"text-anchor":"middle","font-size":11,fill:"#1c1b18","font-family":"Georgia,serif"},words[0]));
    svg.appendChild(el("text",{x:x,y:pB+35,"text-anchor":"middle","font-size":10,fill:"#5c6672","font-family":"Georgia,serif"},words.slice(1).join(" ")));
  });
  $("legend").innerHTML=`<span><i style="border-color:${AC}"></i>Excludes zero</span><span><i style="border-color:${GREY}"></i>Not distinguishable from zero</span>`;
  $("note").innerHTML=`The price and sale-volume response to a flood, as a single difference over the impact window (months +1 and +2) and a lagged window (+3 to +6). Composition-adjusted sold prices do not move: the estimates sit on or near zero. The transient dip in demand does not become a lasting markdown in price, and that gap is the intent-to-move wedge. Bars are 95% confidence intervals.`;
}
function draw(){ view==="demand"?drawDemand():view==="split"?drawSplit():drawPrices(); }
</script>
<script data-pageviews="1">
(function () {
  if (window.__pageviews) return;
  window.__pageviews = true;
  var CODE = "helenxhbao";
  var BASE = "https://" + CODE + ".goatcounter.com/counter/";

  // GoatCounter answers with a JSON body even when it replies 404, which is what
  // it does for a path that has had no views yet, so the body is read regardless
  // of status. Returns {n, text} with the count as a number and as GoatCounter's
  // own formatted string, which carries the thousands separators.
  function read(url) {
    return fetch(url, { mode: "cors" })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (d) {
        if (!d || d.count === undefined || d.count === null) return { n: 0, text: null };
        var n = parseInt(String(d.count).replace(/[^0-9]/g, ""), 10);
        return { n: isNaN(n) ? 0 : n, text: String(d.count) };
      })
      .catch(function () { return { n: 0, text: null }; });
  }

  // The documented path form keeps its leading slash, which leaves a double
  // slash after /counter/. The undoubled form also answers, so if the documented
  // one comes back empty the other is tried before giving up.
  function pageCount(path) {
    return read(BASE + path + ".json").then(function (a) {
      if (a.n > 0) return a;
      return read(BASE + path.replace(/^[/]/, "") + ".json");
    });
  }

  function render() {
    var host = document.querySelector("article") ||
               document.querySelector(".center") ||
               document.body;
    if (!host) return;
    var old = document.querySelector(".pageviews");
    if (old) old.remove();

    var path = location.pathname.replace(/index[.]html$/, "");
    if (path.length > 1) path = path.replace(/[/]$/, "");
    var isHome = path === "/" || path === "";

    var jobs = [pageCount(isHome ? "/" : path)];
    if (isHome) jobs.push(read(BASE + "TOTAL.json"));

    Promise.all(jobs).then(function (res) {
      var parts = [];
      if (res[0].n > 0) parts.push(res[0].text + " views of this page");
      if (isHome && res[1] && res[1].n > 0) parts.push(res[1].text + " views across the site");
      if (!parts.length) return;   // nothing recorded yet: show nothing at all
      var el = document.createElement("p");
      el.className = "pageviews";
      el.setAttribute("aria-live", "polite");
      el.textContent = parts.join(" · ");
      host.appendChild(el);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render);
  } else {
    render();
  }
  document.addEventListener("nav", render);
})();
</script></body>
</html>
