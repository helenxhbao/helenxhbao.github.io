<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coastal erosion and a certain loss</title>
<style>
  :root{--paper:#eff5f3;--ink:#1c1b18;--accent:#4f7d78;--accent2:#a9c4bf;--muted:#556661;--hair:#cfe0da;}
  *{box-sizing:border-box;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Spectral",Georgia,"Times New Roman",serif;line-height:1.5;}
  .wrap{max-width:820px;margin:0 auto;padding:12px 14px 22px;}
  h1{font-size:1.3rem;margin:.2rem 0 .1rem;}
  .sub{color:var(--muted);margin:.1rem 0 .8rem;max-width:70ch;}
  .controls{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-bottom:6px;}
  .ctl{display:flex;flex-direction:column;gap:3px;font-size:.72rem;color:var(--muted);}
  .seg{display:inline-flex;border:1px solid var(--hair);border-radius:4px;overflow:hidden;}
  .seg button{font-family:inherit;font-size:.85rem;padding:5px 13px;border:0;background:#fff;color:var(--ink);cursor:pointer;}
  .seg button.on{background:var(--accent);color:#fff;}
  #chart{width:100%;height:auto;display:block;}
  .legend{display:flex;gap:18px;font-size:.85rem;margin:6px 2px 0;flex-wrap:wrap;}
  .legend span{display:inline-flex;align-items:center;gap:6px;}
  .legend i{width:20px;height:0;border-top:3px solid;display:inline-block;}
  .note{font-size:.78rem;color:var(--muted);margin:8px 2px 0;max-width:84ch;line-height:1.45;}
  .tip{position:fixed;pointer-events:none;background:#fff;border:1px solid var(--hair);border-radius:3px;padding:6px 8px;font-size:.8rem;box-shadow:0 2px 8px rgba(0,0,0,.12);opacity:0;transition:opacity .08s;z-index:20;}
  body.embed h1,body.embed .sub{display:none;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Coastal erosion and a certain loss</h1>
  <p class="sub">A cliff-top home has a readable remaining life and then it is gone. Does the market mark it down? English coast, listing and sale histories.</p>
  <div class="controls">
    <div class="ctl">View<div class="seg" id="segView">
      <button data-v="prices" class="on">Prices don't mark down</button><button data-v="exit">No rush for the exit</button><button data-v="own">Who is left holding it</button></div></div>
  </div>
  <svg id="chart" viewBox="0 0 720 400" role="img" aria-label="Coastal erosion evidence"></svg>
  <div class="legend" id="legend"></div>
  <div class="note" id="note"></div>
</div>
<div class="tip" id="tip"></div>
<script>
const $=id=>document.getElementById(id);
if(location.hash.includes("embed")||location.search.includes("embed"))document.body.classList.add("embed");
const NS="http://www.w3.org/2000/svg";
const AC="#4f7d78", AC2="#8bb0aa", ERO="#c0663a", PRO="#4f7d78", GREY="#a9b7b2";
function el(n,a,t){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;return e;}
let D=null,view="prices";
fetch("data/coastal.json?v=1").then(r=>r.json()).then(d=>{D=d;
  $("segView").querySelectorAll("button").forEach(b=>b.onclick=()=>{view=b.dataset.v;
    $("segView").querySelectorAll("button").forEach(x=>x.classList.toggle("on",x===b));draw();});
  draw();});

function frame(W,H){const svg=$("chart");svg.setAttribute("viewBox",`0 0 ${W} ${H}`);svg.innerHTML="";
  svg.appendChild(el("rect",{x:1,y:1,width:W-2,height:H-2,rx:12,fill:"#fff",stroke:"#e2eeea","stroke-width":1.5}));return svg;}
function yaxis(svg,mL,W,mR,Y,lo,hi,step,fmt){for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step){const gy=Y(v),z=Math.abs(v)<1e-9;
  svg.appendChild(el("line",{x1:mL,y1:gy,x2:W-mR,y2:gy,stroke:z?"#a9bdb6":"#e9f1ee","stroke-width":z?1.4:1,"stroke-dasharray":z?"4 3":""}));
  svg.appendChild(el("text",{x:mL-8,y:gy+3,"text-anchor":"end","font-size":11,fill:"#556661","font-family":"Georgia,serif"},fmt(v)));}}

function drawPrices(){
  const W=720,H=400,mL=64,mR=150,mT=26,mB=48,pT=mT,pB=H-mB,svg=frame(W,H);
  const E=D.path.eroding, P=D.path.protected, yrs=E.map(d=>d.year);
  const y0=Math.min(...yrs),y1=Math.max(...yrs),X=y=>mL+((y-y0)/(y1-y0))*(W-mL-mR);
  const all=E.concat(P).map(d=>d.val).concat([0]);let lo=Math.min(...all),hi=Math.max(...all);const pad=(hi-lo)*0.14;lo-=pad;hi+=pad;
  const Y=v=>pT+(1-(v-lo)/(hi-lo))*(pB-pT);
  yaxis(svg,mL,W,mR,Y,lo,hi,5,v=>(v>0?"+":"")+v+"%");
  svg.appendChild(el("text",{x:15,y:(pT+pB)/2,"text-anchor":"middle","font-size":11,fill:"#556661","font-family":"Georgia,serif",transform:`rotate(-90 15 ${(pT+pB)/2})`},"Within-property price, indexed to 2018"));
  [["Eroding",E,ERO],["Protected",P,PRO]].forEach(([lab,S,c],j)=>{
    svg.appendChild(el("path",{d:S.map((d,i)=>(i?"L":"M")+X(d.year).toFixed(1)+" "+Y(d.val).toFixed(1)).join(" "),fill:"none",stroke:c,"stroke-width":2.6,"stroke-linejoin":"round"}));
    S.forEach(d=>svg.appendChild(el("circle",{cx:X(d.year),cy:Y(d.val),r:3.2,fill:c,stroke:"#fff","stroke-width":1})));
    svg.appendChild(el("text",{x:W-mR+8,y:pT+16+j*16,"font-size":11.5,fill:c,"font-family":"Georgia,serif"},"— "+lab));});
  yrs.forEach(y=>svg.appendChild(el("text",{x:X(y),y:pB+18,"text-anchor":"middle","font-size":10.5,fill:"#556661","font-family":"Georgia,serif"},y)));
  const mt=D.path_meta;
  $("legend").innerHTML="";
  $("note").innerHTML=`The price path of the same property over time (property fixed effects remove its view, street and character), indexed to 2018, for eroding frontages against protected Hold-the-Line ones. The two tracks move together: a doomed home does not fall behind a safe one as its remaining life shortens. The differential trend for the eroding group is ${(mt.coef_pct_per_yr>=0?"+":"")}${mt.coef_pct_per_yr.toFixed(2)}% a year (t = ${mt.t.toFixed(2)}), statistically indistinguishable from zero, across ${mt.n_prop.toLocaleString()} repeat-listed properties. The certain loss is not being priced.`;
}
function drawBars(rows,val,ylab,fmt,step,color,legend,note,pct){
  const W=720,H=400,mL=64,mR=20,mT=26,mB=58,pT=mT,pB=H-mB,svg=frame(W,H);
  const n=rows.length,slot=(W-mL-mR)/n,bw=Math.min(70,slot*0.5);
  let hi=Math.max(...rows.map(val))*1.15;const Y=v=>pT+(1-v/hi)*(pB-pT);
  for(let v=0;v<=hi+1e-9;v+=step){const gy=Y(v);
    svg.appendChild(el("line",{x1:mL,y1:gy,x2:W-mR,y2:gy,stroke:"#e9f1ee","stroke-width":1}));
    svg.appendChild(el("text",{x:mL-8,y:gy+3,"text-anchor":"end","font-size":11,fill:"#556661","font-family":"Georgia,serif"},fmt(v)));}
  svg.appendChild(el("text",{x:15,y:(pT+pB)/2,"text-anchor":"middle","font-size":11,fill:"#556661","font-family":"Georgia,serif",transform:`rotate(-90 15 ${(pT+pB)/2})`},ylab));
  rows.forEach((d,i)=>{const cx=mL+(i+0.5)*slot,v=val(d),doomed=/Doomed/.test(d.band);
    svg.appendChild(el("rect",{x:cx-bw/2,y:Y(v),width:bw,height:pB-Y(v),rx:2,fill:doomed?ERO:color,opacity:doomed?1:.82}));
    svg.appendChild(el("text",{x:cx,y:Y(v)-6,"text-anchor":"middle","font-size":11,fill:"#1c1b18","font-family":"Georgia,serif"},fmt(v)));
    svg.appendChild(el("text",{x:cx,y:pB+18,"text-anchor":"middle","font-size":11,fill:"#1c1b18","font-family":"Georgia,serif"},d.band));
    svg.appendChild(el("text",{x:cx,y:pB+33,"text-anchor":"middle","font-size":9.5,fill:"#8a9a94","font-family":"Georgia,serif"},(pct?d.properties:d.stock).toLocaleString()+" homes"));});
  $("legend").innerHTML=legend;$("note").innerHTML=note;
}
function drawExit(){
  drawBars(D.exit,d=>d.list_rate,"Homes listed for sale per year (%)",v=>v.toFixed(0)+"%",5,AC,
    `<span><i style="border-color:${ERO}"></i>Doomed frontage</span><span><i style="border-color:${AC}"></i>Other</span>`,
    `The share of homes put up for sale each year, by erosion exposure. If owners were racing to sell before the cliff reached them, the doomed group would list far more often. It lists only a little more than the protected group (about 17% against 14%), and time on market is no shorter. Exit is not brought forward.`,false);
}
function drawOwn(){
  const W=720,H=400,mL=64,mR=140,mT=26,mB=58,pT=mT,pB=H-mB,svg=frame(W,H);
  const rows=D.ownership,cats=[["landlord","Landlord",AC],["corporate","Company",AC2],["overseas","Overseas",ERO]];
  const n=rows.length,slot=(W-mL-mR)/n,gw=slot*0.62,bw=gw/cats.length;
  let hi=Math.max(...rows.map(d=>d.landlord))*1.15;const Y=v=>pT+(1-v/hi)*(pB-pT);
  for(let v=0;v<=hi+1e-9;v+=10){const gy=Y(v);
    svg.appendChild(el("line",{x1:mL,y1:gy,x2:W-mR,y2:gy,stroke:"#e9f1ee","stroke-width":1}));
    svg.appendChild(el("text",{x:mL-8,y:gy+3,"text-anchor":"end","font-size":11,fill:"#556661","font-family":"Georgia,serif"},v+"%"));}
  svg.appendChild(el("text",{x:15,y:(pT+pB)/2,"text-anchor":"middle","font-size":11,fill:"#556661","font-family":"Georgia,serif",transform:`rotate(-90 15 ${(pT+pB)/2})`},"Share of homes (%)"));
  rows.forEach((d,i)=>{const x0=mL+(i+0.5)*slot-gw/2;
    cats.forEach(([k,lab,c],j)=>{const v=d[k],x=x0+j*bw;
      svg.appendChild(el("rect",{x:x,y:Y(v),width:bw-2,height:pB-Y(v),rx:1.5,fill:c}));});
    svg.appendChild(el("text",{x:x0+gw/2,y:pB+18,"text-anchor":"middle","font-size":11,fill:"#1c1b18","font-family":"Georgia,serif"},d.band));});
  cats.forEach(([k,lab,c],j)=>{svg.appendChild(el("rect",{x:W-mR+8,y:pT+8+j*18,width:12,height:12,rx:2,fill:c}));
    svg.appendChild(el("text",{x:W-mR+24,y:pT+18+j*18,"font-size":11,fill:"#1c1b18","font-family":"Georgia,serif"},lab));});
  $("legend").innerHTML="";
  $("note").innerHTML=`The end-of-chain owner of at-risk homes, by erosion band. The most exposed homes are the LEAST held by landlords, companies, or overseas owners: on doomed frontages landlord ownership is ${D.ownership[0].landlord.toFixed(0)}% against ${D.ownership[3].landlord.toFixed(0)}% on protected coast, and corporate ${D.ownership[0].corporate.toFixed(1)}% against ${D.ownership[3].corporate.toFixed(1)}%. The last owner in the chain is typically an individual owner-occupier, so the uncapitalised loss comes to rest on a resident household. The last owner pays.`;
}
function draw(){ view==="prices"?drawPrices():view==="exit"?drawExit():drawOwn(); }
</script>
<script data-pageviews="1">
(function () {
  if (window.__pageviews) return;
  window.__pageviews = true;
  var CODE = "helenxhbao";
  var BASE = "https://" + CODE + ".goatcounter.com/counter/";

  // GoatCounter answers with a JSON body even when it replies 404, which is what
  // it does for a path that has had no views yet, so the body is read regardless
  // of status. Returns {n, text} with the count as a number and as GoatCounter's
  // own formatted string, which carries the thousands separators.
  function read(url) {
    return fetch(url, { mode: "cors" })
      .then(function (r) { return r.json().catch(function () { return null; }); })
      .then(function (d) {
        if (!d || d.count === undefined || d.count === null) return { n: 0, text: null };
        var n = parseInt(String(d.count).replace(/[^0-9]/g, ""), 10);
        return { n: isNaN(n) ? 0 : n, text: String(d.count) };
      })
      .catch(function () { return { n: 0, text: null }; });
  }

  // The documented path form keeps its leading slash, which leaves a double
  // slash after /counter/. The undoubled form also answers, so if the documented
  // one comes back empty the other is tried before giving up.
  function pageCount(path) {
    return read(BASE + path + ".json").then(function (a) {
      if (a.n > 0) return a;
      return read(BASE + path.replace(/^[/]/, "") + ".json");
    });
  }

  function render() {
    var host = document.querySelector("article") ||
               document.querySelector(".center") ||
               document.body;
    if (!host) return;
    var old = document.querySelector(".pageviews");
    if (old) old.remove();

    var path = location.pathname.replace(/index[.]html$/, "");
    if (path.length > 1) path = path.replace(/[/]$/, "");
    var isHome = path === "/" || path === "";

    var jobs = [pageCount(isHome ? "/" : path)];
    if (isHome) jobs.push(read(BASE + "TOTAL.json"));

    Promise.all(jobs).then(function (res) {
      var parts = [];
      if (res[0].n > 0) parts.push(res[0].text + " views of this page");
      if (isHome && res[1] && res[1].n > 0) parts.push(res[1].text + " views across the site");
      if (!parts.length) return;   // nothing recorded yet: show nothing at all
      var el = document.createElement("p");
      el.className = "pageviews";
      el.setAttribute("aria-live", "polite");
      el.textContent = parts.join(" · ");
      host.appendChild(el);
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", render);
  } else {
    render();
  }
  document.addEventListener("nav", render);
})();
</script></body>
</html>
